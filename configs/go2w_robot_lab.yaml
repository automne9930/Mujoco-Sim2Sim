# robot_lab Go2W 57 维策略的 Sim2Sim 配置
# 顺序列表全部显式写出，代码不做任何名称猜测。

scene_xml: scene.xml
policy_onnx: /home/auto/Robomaster/Projects/IsaacLab/robot_lab/logs/rsl_rl/unitree_go2w_rough/2026-10-09_12-11-24/exported/policy.onnx

sim_dt: 0.005
decimation: 4

# ---- 策略输入/输出顺序（robot_lab，观测与动作同序）----
isaaclab_joint_names:
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - FR_foot_joint
  - FL_foot_joint
  - RR_foot_joint
  - RL_foot_joint

# ---- MuJoCo go2w.xml 中 qpos[7:23] / qvel[6:22] 的顺序 ----
mujoco_obs_joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FL_foot_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FR_foot_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RL_foot_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RR_foot_joint

# ---- MuJoCo go2w.xml 中 ctrl[:] 的 actuator 顺序（目前与关节顺序相同）----
mujoco_actuator_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FL_foot_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FR_foot_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RL_foot_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RR_foot_joint

# ---- 动作 / 默认姿态（Isaac 顺序）----
leg_joint_count: 12
default_joint_pos: [0.0, 0.8, -1.5, 0.0, 0.8, -1.5, 0.0, 0.8, -1.5, 0.0, 0.8, -1.5,
                    0.0, 0.0, 0.0, 0.0]
leg_action_scale: 0.25
hip_action_scale: 0.125
wheel_action_scale: 5.0

# ---- 执行器 ----
leg_kp: 25.0
leg_kd: 0.5
wheel_kd: 0.5
effort_limit: 23.5
velocity_limit: 30.0

# ---- 观测 ----
ang_vel_scale: 0.25
joint_pos_scale: 1.0
joint_vel_scale: 0.05
obs_clip: 100.0
zero_wheel_joint_pos: true

# ---- 初始化 ----
init_base_height: 0.45

# ---- 键盘遥控 ----
cmd_vx: 0.5
cmd_vy: 0.3
cmd_wz: 0.5
keyboard_device: null    # null = 自动扫描所有带字母键的键盘；也可填 /dev/input/event11
